name = "hytale-auth"
version = "0.1.0"
wasm = "hytale-auth.wasm"

capabilities = [
    "transport.http.inbound",
    "transport.http.outbound",
    "storage.fs",
]

[config]
# Shared secret gating the credential-minting GET /tokens route. Auth is OFF
# unless this is set: when empty (the default) /tokens serves WITHOUT auth so
# the existing Bananagine pre-start hook (which sends no header) keeps working
# — no 401, no outage. To ENABLE auth, set a non-empty token HERE *and* have
# the Bananagine pre-start hook send the same value as the X-Service-Token
# header, in lockstep. This is the PRIMARY source — the Pulp host does NOT
# forward a SERVICE_TOKEN env var into the WASI sandbox, so an env-only token
# would never reach the cell. (A SERVICE_TOKEN env override is honored only if
# a future host forwards the key.)
service_token = ""
